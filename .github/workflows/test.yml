name: Tests

# Fifty-four suites live in scripts/, and until now not one of them ran anywhere but on
# the machine the code was written on: pages.yml built the site and published it without
# asking a single question first. Seven checks in test-security had been red since before
# session D, four browser suites asserted the shop was still closed months after it opened,
# and nobody found out, because nothing was looking.
#
# Two jobs rather than one. The logic suites need nothing but node and finish in a couple
# of minutes; the browser suites need a Chromium and are the slow half. Both gate the
# deploy (pages.yml waits on this workflow), so a red suite stops the site from shipping.

# No `push` trigger: on main this workflow is called by pages.yml, which waits for it
# before publishing. A push trigger here as well would run all fifty-four suites twice for
# every commit and let the site ship while the second copy was still deciding.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: the suites that need no browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The 523 pages are generated from src/ (src/template.mjs and its neighbours), so a
      # page edited in place is a page the next build silently reverts. Building first and
      # asking git whether anything moved is what catches that — and it has to come before
      # the suites, because most of them read the shipped .html rather than the source.
      # Reporting, not gating, and only until the first run says what it sees. On a clean
      # LF checkout here the build came out identical under node 22 and node 24, in both
      # time zones — and the runner still found a difference, so the difference is
      # something this machine cannot reproduce and the log has to name it. Gating on a
      # rule nobody has read the output of would have stopped the deploy on a question
      # rather than on an answer.
      - name: Build, and report any drift between the shipped files and their source
        continue-on-error: true
        run: |
          node scripts/build.mjs
          if git diff --quiet -- . ':(exclude).github'; then
            echo "the built files match src/"
          else
            # One ::warning:: per line, not a plain echo: the step log needs a token to
            # read and the annotations do not, and this has to be readable from the
            # machine that has to act on it.
            echo "::warning::The built files differ from what src/ produces."
            git status --short -- . ':(exclude).github' | head -25 \
              | while IFS= read -r line; do echo "::warning::moved: $line"; done
            git diff --stat -- . ':(exclude).github' | tail -3 \
              | while IFS= read -r line; do echo "::warning::stat: $line"; done
            git diff -- . ':(exclude).github' | grep '^[+-]' | grep -v '^[+-][+-]' | head -6 \
              | while IFS= read -r line; do echo "::warning::line: $line"; done
          fi

      - name: Run them
        run: |
          status=0
          for f in scripts/test-*.mjs; do
            case "$f" in
              # The browser half, run by the other job.
              *-page.mjs|scripts/test-mobile.mjs|scripts/test-phone.mjs|scripts/test-qa.mjs|scripts/test-pages.mjs) continue ;;
              # Deliberately not a gate: see the step below.
              scripts/test-copy.mjs) continue ;;
            esac
            echo "--- $f"
            node "$f" || status=1
          done
          exit $status

      # test-copy §7 holds three pages over their prose budget — /app/ at 1501 words
      # against 850, fr/projets at 856, privacy-policy at 3813 against 3800. Those are a
      # decision about copy that belongs to session H, not a regression, so the suite is
      # reported and not allowed to hold the site back. When session H closes the budgets
      # this step moves into the loop above and this comment goes with it.
      - name: The prose budgets (reported, not gating until session H)
        continue-on-error: true
        run: node scripts/test-copy.mjs

  browser:
    name: the suites that drive Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Playwright is deliberately not a dependency of this repo — there is no package.json
      # and the logic suites must keep running on a machine that has never heard of it. It
      # is installed here, beside the checkout, and named through LM_PLAYWRIGHT.
      - name: Install Playwright beside the repo
        run: |
          mkdir -p "$RUNNER_TEMP/lm-test"
          cd "$RUNNER_TEMP/lm-test"
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Build
        run: node scripts/build.mjs

      # Every browser suite exits 0 with the word "skipping" when it cannot find a
      # Chromium — which is right on a laptop and would make this job a green light that
      # tested nothing. So the browser is proved present before any of them runs.
      - name: Prove a browser is actually there
        env:
          LM_PLAYWRIGHT: ${{ runner.temp }}/lm-test/node_modules/playwright
        run: |
          node -e "
            const { pathToFileURL } = require('node:url');
            import(pathToFileURL(process.env.LM_PLAYWRIGHT + '/index.mjs').href)
              .then(async (pw) => {
                const b = await pw.chromium.launch();
                console.log('chromium', b.version());
                await b.close();
              })
              .catch((e) => { console.error('::error::no Chromium: ' + e.message); process.exit(1); });
          "

      - name: Run them
        env:
          LM_PLAYWRIGHT: ${{ runner.temp }}/lm-test/node_modules/playwright
        run: |
          status=0
          for f in scripts/test-*-page.mjs scripts/test-mobile.mjs scripts/test-phone.mjs \
                   scripts/test-qa.mjs scripts/test-pages.mjs; do
            echo "--- $f"
            out=$(node "$f" 2>&1) || status=1
            echo "$out"
            # A suite that skipped is a suite that measured nothing, and this job exists to
            # measure. Treated as a failure rather than as a pass.
            case "$out" in
              *skipping*) echo "::error::$f skipped instead of running"; status=1 ;;
            esac
          done
          exit $status

<!DOCTYPE html>
<html lang="pl">
<head>
<script>
  try {
    var m = localStorage.getItem('liczmat-theme');
    if (m === 'dark' || m === 'light') document.documentElement.setAttribute('data-theme', m);
  } catch (e) {}
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nie ma takiej strony — LiczMat</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/favicon.svg?v=20260812c" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css?v=20260812c">
<script>
  // GitHub Pages serves this file for every path it cannot resolve, and it has no
  // rewrite rules. A shared estimate lives at /p/<token>, where the token is an
  // unbounded random string and therefore cannot be a real directory — so catch it
  // here and hand it to /p/, which reads the token from ?t=.
  (function () {
    var m = location.pathname.match(/^\/p\/([A-Za-z0-9_-]{16,})\/?$/);
    if (m) location.replace("/p/?t=" + encodeURIComponent(m[1]) + location.hash);

    // LiczMat shipped ten languages until 2026-08-12 and now ships four. The six that
    // went away leave inbound links behind: /cs/, /sk/, /ro/, /hr/, /sr/, /ru/ and
    // everything under them. Their slugs have no counterpart in the languages that
    // stayed, so the honest landing place is the home page rather than a guess.
    if (/^\/(cs|sk|ro|hr|sr|ru)(\/|$)/.test(location.pathname)) location.replace("/");
  })();
</script>
</head>
<body>
<main id="main" class="block block-fill">
  <div class="wrap narrow center">
    <h1>404</h1>
    <p class="lead">Nie ma takiej strony.</p>
    <p class="mt-6">
      <a class="btn btn-primary" href="/">Strona główna</a>
      <a class="btn btn-ghost" href="/kalkulatory/">Kalkulatory</a>
    </p>
  </div>
</main>
</body>
</html>

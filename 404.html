<!DOCTYPE html>
<html lang="pl">
<head>
<script>
  try {
    var m = localStorage.getItem('liczmat-theme');
    if (m === 'dark' || m === 'light') document.documentElement.setAttribute('data-theme', m);
  } catch (e) {}
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nie ma takiej strony — LiczMat</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/favicon.svg?v=20260902a" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png?v=20260902a" sizes="32x32" type="image/png">
<link rel="stylesheet" href="/assets/styles.min.css?v=20260902a">
<script>
  // GitHub Pages serves this file for every path it cannot resolve, and it has no
  // rewrite rules. A shared estimate lives at /p/<token>, where the token is a random
  // string and therefore cannot be a real directory — so catch it here and hand it to
  // /p/, which reads the token from ?t=. The shape is the one assets/share.js accepts
  // (session 35): a real token is 22 URL-safe base64 characters, and anything else is
  // some other address that happens to start with /p/.
  (function () {
    var m = location.pathname.match(/^\/p\/([A-Za-z0-9_-]{16,64})\/?$/);
    if (m) location.replace("/p/?t=" + encodeURIComponent(m[1]) + location.hash);

    // Five of the six languages dropped on 2026-08-12 were brought back after session 28,
    // at the addresses they always had, so nothing forwards /cs/, /sk/, /ro/, /hr/ or
    // /sr/ any more: leaving that in would have bounced every restored page off itself.
    //
    // Russian is the one that left instead (2026-09-02, the owner's decision, in the same
    // change that added Italian, Dutch, Spanish and French). Its twenty-nine pages were
    // live and indexed, and a withdrawn language that simply stops answering keeps its
    // inbound links pointed at a 404 — so /ru/… lands on the Polish home page, which is
    // the same treatment the six had while they were away. RETIRED_LANGS in src/site.mjs
    // is the other half: the build deletes /ru/ and its dictionary bundle.
    if (/^\/ru(\/|$)/.test(location.pathname)) location.replace("/");

    // The dashboard shipped as /app/pulpit/ on 2026-08-13 and was renamed to
    // /app/dashboard/ the same day, before anything linked to it: /app/ and /p/ are
    // language-neutral, and a Polish word in the address of a page that has no language
    // was the odd one out. Three lines of insurance for a bookmark made in those hours.
    if (/^\/app\/pulpit\/?$/.test(location.pathname)) location.replace("/app/dashboard/");
  })();
</script>
</head>
<body>
<main id="main" class="block block-fill">
  <div class="wrap narrow center">
    <h1>404</h1>
    <p class="lead">Nie ma takiej strony.</p>
    <p class="mt-6">
      <a class="btn btn-primary" href="/">Strona główna</a>
      <a class="btn btn-ghost" href="/kalkulatory/">Kalkulatory</a>
    </p>
  </div>
</main>
</body>
</html>
